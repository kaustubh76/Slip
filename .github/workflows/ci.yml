name: CI

# Every push (any branch) and every pull request: install exactly what the lockfile says,
# lint, then type-check and test everything.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  postgres:
    name: Store contract and races on Postgres 18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: slip
          POSTGRES_PASSWORD: slip
          POSTGRES_DB: slip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slip -d slip"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only this step sees the database: each test file creates and drops its own.
      - name: Store contract, database guards and concurrency on real Postgres
        run: pnpm exec vitest run --project db
        env:
          SLIP_TEST_DATABASE_URL: postgres://slip:slip@localhost:5432/postgres

  web:
    name: Web build and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `next build` type-checks through the project's own TypeScript 7 compiler.
      - run: pnpm web:build
      - name: Chromium for Playwright
        run: pnpm --filter @slip/web exec playwright install --with-deps chromium
      # Demo mode against the built app: in-memory store and the stand-ins, no keys needed.
      - run: pnpm web:e2e
        env:
          CI: "true"
      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
