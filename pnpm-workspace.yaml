packages:
  - packages/*
  - apps/*
  - study
  - bench
  - tests

# esbuild (pulled in by vitest) is the only dependency allowed to run a postinstall script.
onlyBuiltDependencies:
  - esbuild

# Every dependency version lives here once; packages reference them with "catalog:".
catalogMode: strict
catalog:
  "@biomejs/biome": 2.5.15
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  "@electric-sql/pglite": 0.5.8
  fast-check: 4.10.2
  jsdom: 30.1.2
  postgres: 3.4.9
  react: 19.3.0
  react-dom: 19.3.0
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  tsx: 4.23.15
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  typescript: 7.0.2
  vitest: 5.0.3
  zod: 4.6.5
